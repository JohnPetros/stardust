version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      patch-and-minor:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "@designliquido/delegua"
          - "tailwindcss"
          - "@types/node"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
