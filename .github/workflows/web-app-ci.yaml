name: Web app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "apps/web/**"
      - "packages/core/**"
      - "packages/validation/**"
      - "packages/lsp/**"
      - ".dependency-cruiser.cjs"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check architecture
        run: npm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Check code
        run: npm run check:code -w @stardust/web

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Check types
        run: npm run check:types -w @stardust/web

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_SUPABASE_URL=https://testing.supabase.local
          NEXT_PUBLIC_SUPABASE_ANON_KEY=fake-supabase-anon-key
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build LSP package
        run: npm run build -w @stardust/lsp

      - name: Run tests
        run: npm run test:unit -w @stardust/web

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_SUPABASE_URL=https://testing.supabase.local
          NEXT_PUBLIC_SUPABASE_ANON_KEY=fake-supabase-anon-key
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Install Playwright browsers
        run: npm exec --workspace=@stardust/web -- playwright install --with-deps chromium

      - name: Run integration tests
        run: npm run test:integration -w @stardust/web

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-types
      - tests
      - integration-tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create build environment file
        run: |
          cat <<'EOF' > apps/web/.env
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_SUPABASE_URL=https://testing.supabase.local
          NEXT_PUBLIC_SUPABASE_ANON_KEY=fake-supabase-anon-key
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            npm ci --prefer-offline --no-audit && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "npm ci failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build project
        run: npm run build:web
