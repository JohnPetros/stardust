name: Web app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/web/**"
      - "packages/core/**"
      - "packages/validation/**"
      - "packages/lsp/**"
      - ".dependency-cruiser.cjs"
      - "coverage-baseline.json"
      - "scripts/check-coverage-baseline.mjs"
      - ".code-multivitals-baseline.json"
      - ".code-multivitals.json"
      - "scripts/check-complexity.mjs"
      - "scripts/tests/check-complexity.test.mjs"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Check code
        run: pnpm --filter @stardust/web run check:code

  check-code-complexity:
    name: check-code-complexity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        run: pnpm --filter @stardust/web run check:complexity

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Check types
        run: pnpm --filter @stardust/web run check:types

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build LSP package
        run: pnpm --filter @stardust/lsp run build

      - name: Run tests
        run: pnpm --filter @stardust/web run test:coverage

      - name: Check coverage baseline
        run: pnpm run check:coverage @stardust/web

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Install Playwright browsers
        run: pnpm --filter @stardust/web exec playwright install --with-deps chromium

      - name: Run integration tests
        run: pnpm --filter @stardust/web run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-code-complexity
      - check-types
      - unit-tests
      - integration-tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create build environment file
        run: |
          cat <<'EOF' > apps/web/.env
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build project
        run: pnpm run build:web
