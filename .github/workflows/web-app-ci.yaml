name: Web app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/web/**"
      - "packages/core/**"
      - "packages/validation/**"
      - "packages/lsp/**"
      - ".dependency-cruiser.cjs"
      - "coverage-baseline.json"
      - "scripts/check-coverage-baseline.mjs"
      - "scripts/check-changed-coverage.mjs"
      - "scripts/write-coverage-report.mjs"
      - "scripts/tests/check-changed-coverage.test.mjs"
      - "scripts/tests/write-coverage-report.test.mjs"
      - ".code-multivitals.json"
      - "scripts/check-complexity.mjs"
      - "scripts/comment-complexity-report.mjs"
      - "scripts/tests/check-complexity.test.mjs"
      - "scripts/tests/comment-complexity-report.test.mjs"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Check code
        run: pnpm --filter @stardust/web run check:code

  check-code-complexity:
    name: check-code-complexity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The complexity gate diffs against the first parent.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        id: complexity
        run: |
          node --test scripts/tests/check-complexity.test.mjs scripts/tests/comment-complexity-report.test.mjs
          pnpm --filter @stardust/web run check:complexity --base HEAD^1 --output "$GITHUB_WORKSPACE/complexity-report.md"

      - name: Publish complexity on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.complexity.outputs.findings != '' }}
        uses: actions/github-script@v9
        env:
          HAS_FINDINGS: ${{ steps.complexity.outputs.findings }}
        with:
          script: |
            const { commentComplexityReport } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/comment-complexity-report.mjs`
            )
            const outcome = await commentComplexityReport({
              github,
              context,
              workspace: 'web',
              reportPath: `${process.env.GITHUB_WORKSPACE}/complexity-report.md`,
              hasFindings: process.env.HAS_FINDINGS === 'true',
            })
            core.info(`Complexity comment: ${outcome}`)

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Check types
        run: pnpm --filter @stardust/web run check:types

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The changed-lines coverage gate diffs against the first parent.
          fetch-depth: 2

      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build LSP package
        run: pnpm --filter @stardust/lsp run build

      - name: Run tests
        run: pnpm --filter @stardust/web run test:coverage

      - name: Check coverage floors
        id: floors
        run: pnpm run check:coverage @stardust/web

      - name: Write coverage report
        if: ${{ !cancelled() && hashFiles('apps/web/coverage/coverage-summary.json') != '' }}
        run: node scripts/write-coverage-report.mjs web apps/web/coverage/coverage-summary.json apps/web/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.floors.outcome }}

      - name: Check coverage of changed lines
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('apps/web/coverage/lcov.info') != '' }}
        run: |
          node --test scripts/tests/check-changed-coverage.test.mjs scripts/tests/write-coverage-report.test.mjs
          node scripts/check-changed-coverage.mjs web apps/web/coverage/lcov.info --base HEAD^1 --output apps/web/coverage/coverage-comment.md

      - name: Publish coverage on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && hashFiles('apps/web/coverage/coverage-comment.md') != '' }}
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs')
            const marker = '<!-- coverage-report:web -->'
            const body = fs.readFileSync('apps/web/coverage/coverage-comment.md', 'utf8')
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            })
            const existing = comments.find(
              (comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker),
            )
            const request = { owner: context.repo.owner, repo: context.repo.repo, body }
            if (existing) {
              await github.rest.issues.updateComment({ ...request, comment_id: existing.id })
            } else {
              await github.rest.issues.createComment({
                ...request,
                issue_number: context.issue.number,
              })
            }

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('apps/web/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: web-coverage-report
          path: |
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/lcov.info
          retention-days: 14

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Install Playwright browsers
        run: pnpm --filter @stardust/web exec playwright install --with-deps chromium

      - name: Run integration tests
        run: pnpm --filter @stardust/web run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-code-complexity
      - check-types
      - unit-tests
      - integration-tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Create build environment file
        run: |
          cat <<'EOF' > apps/web/.env
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        shell: bash
        run: |
          for attempt in 1 2 3; do
            pnpm install --frozen-lockfile --prefer-offline && exit 0

            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi

            echo "pnpm install failed on attempt $attempt. Retrying in 15 seconds..."
            sleep 15
          done

      - name: Build project
        run: pnpm run build:web
