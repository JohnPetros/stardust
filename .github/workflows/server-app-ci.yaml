name: Server app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/server/**"
      - "packages/core/**"
      - "packages/email/**"
      - "packages/validation/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "docker/supabase/**"
      - "scripts/export-local-database-env.mjs"
      - "scripts/check-drizzle-transition.mjs"
      - "scripts/adopt-drizzle-baseline.mjs"
      - "scripts/tests/**"
      - ".dependency-cruiser.cjs"
      - "coverage-baseline.json"
      - "scripts/check-coverage-baseline.mjs"
      - ".code-multivitals-baseline.json"
      - ".code-multivitals.json"
      - "scripts/check-complexity.mjs"
      - "scripts/tests/check-complexity.test.mjs"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter @stardust/server run check:code

  check-code-complexity:
    name: check-code-complexity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        run: pnpm --filter @stardust/server run check:complexity

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm --filter @stardust/server run check:types

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Prepare Server test stack
        uses: ./.github/actions/prepare-server-stack
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test migration and export scripts
        run: pnpm run test:scripts

      - name: Run tests
        run: pnpm --filter @stardust/server run test:coverage

      - name: Upload unit coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-unit-coverage
          path: apps/server/coverage/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  integration-tests:
    name: Integration tests (shard ${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Prepare Server test stack
        uses: ./.github/actions/prepare-server-stack
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Run integration tests
        run: >-
          pnpm --filter @stardust/server run test:integration
          --shard=${{ matrix.shard }}/6
          --coverage
          --maxWorkers=1
          --coverageReporters=json
          --coverageDirectory=coverage/integration-${{ matrix.shard }}

      - name: Upload integration coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: server-integration-coverage-${{ matrix.shard }}
          path: apps/server/coverage/integration-${{ matrix.shard }}/coverage-final.json
          if-no-files-found: error
          retention-days: 1

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs:
      - unit-tests
      - integration-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download unit coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: server-unit-coverage
          path: apps/server/coverage

      - name: Download integration coverage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: server-integration-coverage-*
          path: apps/server/coverage/shards

      - name: Place integration shard reports
        run: |
          for shard in 1 2 3 4 5 6; do
            mkdir -p "apps/server/coverage/integration-$shard"
            mv "apps/server/coverage/shards/server-integration-coverage-$shard/coverage-final.json" \
              "apps/server/coverage/integration-$shard/coverage-final.json"
          done

      - name: Merge unit and integration coverage
        run: pnpm --filter @stardust/server run test:coverage:merge

      - name: Check coverage baseline
        run: pnpm run check:coverage @stardust/server

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-code-complexity
      - check-types
      - tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm run build:server
