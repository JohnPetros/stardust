name: Server app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "apps/server/**"
      - "packages/core/**"
      - "packages/validation/**"
      - "scripts/quality-gate/**"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  codecheck:
    name: Codecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run codecheck
        run: npm run codecheck -w @stardust/server

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run typecheck -w @stardust/server

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      - name: Setup Supabase
        working-directory: apps/server
        run: supabase start

      - name: Rebuild local database from migrations
        working-directory: apps/server
        run: supabase db reset --local --yes

      - name: Create test environment files
        working-directory: apps/server
        run: |
          supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env

          cat <<'EOF' > .env.testing
          MODE='test'
          PORT='3333'
          BASE_URL='http://localhost'
          GOD_ACCOUNT_IDS=f4442be6-ad3e-415b-b31b-cc49a18e1119,
          SUPABASE_URL='http://127.0.0.1:54321'
          SUPABASE_ANON_KEY='__SUPABASE_SECRET_KEY__'
          SUPABASE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          REDIS_URL='redis://127.0.0.1:6379'
          STARDUST_WEB_URL='http://localhost:3000'
          DROPBOX_REFRESH_TOKEN='test-refresh-token'
          DROPBOX_APP_KEY='test-app-key'
          DROPBOX_APP_SECRET='test-app-secret'
          DISCORD_WEBHOOK_URL='https://discord.com/api/webhooks/test'
          SENTRY_DSN='https://test@sentry.io/test'
          INNGEST_EVENT_KEY='test-event-key'
          INNGEST_SIGNING_KEY='test-signing-key'
          POSTHOG_PROJECT_TOKEN='test-posthog-project-token'
          POSTHOG_HOST='https://us.i.posthog.com'
          POSTHOG_PERSONAL_API_KEY='test-posthog-personal-api-key'
          POSTHOG_PROJECT_ID='1'
          EOF
          sed -i "s|__SUPABASE_SECRET_KEY__|${SECRET_KEY}|g" .env.testing
          cp .env.testing .env

      - name: Run tests
        run: npm run test:unit -w @stardust/server

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # A catraca roda a suíte unitária (mocks) para medir cobertura. Não sobe
      # Supabase, mas alguns testes (ai tools) leem env no import.
      - name: Create test environment file
        run: |
          cat <<'EOF' > apps/server/.env.testing
          MODE='test'
          PORT='3333'
          BASE_URL='http://localhost'
          GOD_ACCOUNT_IDS=f4442be6-ad3e-415b-b31b-cc49a18e1119,
          SUPABASE_URL='http://127.0.0.1:54321'
          SUPABASE_ANON_KEY='placeholder-supabase-key'
          SUPABASE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          REDIS_URL='redis://127.0.0.1:6379'
          STARDUST_WEB_URL='http://localhost:3000'
          DROPBOX_REFRESH_TOKEN='test-refresh-token'
          DROPBOX_APP_KEY='test-app-key'
          DROPBOX_APP_SECRET='test-app-secret'
          DISCORD_WEBHOOK_URL='https://discord.com/api/webhooks/test'
          SENTRY_DSN='https://test@sentry.io/test'
          INNGEST_EVENT_KEY='test-event-key'
          INNGEST_SIGNING_KEY='test-signing-key'
          POSTHOG_PROJECT_TOKEN='test-posthog-project-token'
          POSTHOG_HOST='https://us.i.posthog.com'
          POSTHOG_PERSONAL_API_KEY='test-posthog-personal-api-key'
          POSTHOG_PROJECT_ID='1'
          EOF

      - name: Run quality gate
        env:
          QUALITY_GATE_REPORT_FILE: quality-gate-report.md
        run: npm run quality-gate -- --workspace=server

      - name: Comment report on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: bash scripts/quality-gate/comment-pr.sh server quality-gate-report.md

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - codecheck
      - typecheck
      - tests
      - quality-gate

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:server
