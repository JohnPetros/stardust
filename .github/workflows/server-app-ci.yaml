name: Server app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "apps/server/**"
      - "packages/core/**"
      - "packages/email/**"
      - "packages/validation/**"
      - ".dependency-cruiser.cjs"
      - "coverage-baseline.json"
      - "scripts/check-coverage-baseline.mjs"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check architecture
        run: npm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run check:code -w @stardust/server

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check:types -w @stardust/server

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build LSP package
        run: npm run build -w @stardust/lsp

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      - name: Setup Supabase
        working-directory: apps/server
        run: supabase start

      - name: Rebuild local database from migrations
        working-directory: apps/server
        run: supabase db reset --local --yes

      - name: Create test environment files
        working-directory: apps/server
        run: |
          supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env

          cat <<'EOF' > .env.testing
          MODE='test'
          PORT='3333'
          BASE_URL='http://localhost'
          GOD_ACCOUNT_IDS=f4442be6-ad3e-415b-b31b-cc49a18e1119,
          SUPABASE_URL='http://127.0.0.1:54321'
          SUPABASE_ANON_KEY='__SUPABASE_SECRET_KEY__'
          SUPABASE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          REDIS_URL='redis://127.0.0.1:6379'
          S3_ACCOUNT_ID='test-account-id'
          S3_ACCESS_KEY_ID='test-access-key-id'
          S3_SECRET_ACCESS_KEY='test-secret-access-key'
          STARDUST_WEB_URL='http://localhost:3000'
          DROPBOX_REFRESH_TOKEN='test-refresh-token'
          DROPBOX_APP_KEY='test-app-key'
          DROPBOX_APP_SECRET='test-app-secret'
          DISCORD_WEBHOOK_URL='https://discord.com/api/webhooks/test'
          SENTRY_DSN='https://test@sentry.io/test'
          INNGEST_EVENT_KEY='test-event-key'
          INNGEST_SIGNING_KEY='test-signing-key'
          POSTHOG_PROJECT_TOKEN='test-posthog-project-token'
          POSTHOG_HOST='https://us.i.posthog.com'
          POSTHOG_PERSONAL_API_KEY='test-posthog-personal-api-key'
          POSTHOG_PROJECT_ID='1'
          EOF
          sed -i "s|__SUPABASE_SECRET_KEY__|${SECRET_KEY}|g" .env.testing
          cp .env.testing .env

      - name: Run tests
        run: npm run test:coverage -w @stardust/server

      - name: Check coverage baseline
        run: npm run check:coverage -- @stardust/server

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-types
      - tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build:server
