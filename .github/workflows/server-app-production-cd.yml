name: Server app CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/server/**"
      - "packages/core/**"
      - "packages/validation/**"

permissions:
  contents: read

concurrency:
  group: server-app-cd-coolify-production
  cancel-in-progress: false

jobs:
  migrate-database:
    name: Migrate database
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: aukqejqsiqsqowafpppb

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.98.2

      - name: Link production database
        working-directory: apps/server
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Apply pending migrations
        working-directory: apps/server
        run: supabase db push

  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs:
      - migrate-database

    steps:
      - name: Trigger Coolify deploy
        id: trigger
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_SERVER_PROD }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          response="$(curl -X GET "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            --fail --silent --show-error)"

          deployment_uuid="$(jq -er '.deployments[0].deployment_uuid' <<< "$response")"
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Wait for Coolify deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_SERVER_PROD }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.trigger.outputs.deployment_uuid }}
        run: |
          coolify_api_url="${COOLIFY_WEBHOOK_URL%%/deploy*}"

          while true; do
            if ! deployment="$(curl "$coolify_api_url/deployments/$DEPLOYMENT_UUID" \
              -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
              --fail --silent --show-error --max-time 30)"; then
              echo "Unable to read Coolify deployment status; retrying..."
              sleep 10
              continue
            fi

            if ! status="$(jq -er '.status' <<< "$deployment")"; then
              echo "Coolify returned an invalid deployment status; retrying..."
              sleep 10
              continue
            fi

            echo "Coolify deployment status: $status"

            case "$status" in
              finished)
                echo "Coolify deployment finished successfully."
                exit 0
                ;;
              failed|cancelled-by-user)
                echo "Coolify deployment ended with status: $status"
                exit 1
                ;;
              queued|in_progress)
                sleep 10
                ;;
              *)
                echo "Unexpected Coolify deployment status: $status; retrying..."
                sleep 10
                ;;
            esac
          done
