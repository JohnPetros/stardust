name: Core package CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/core/**"
      - ".dependency-cruiser.cjs"
      - "coverage-baseline.json"
      - "scripts/check-coverage-baseline.mjs"
      - "scripts/check-changed-coverage.mjs"
      - "scripts/write-coverage-report.mjs"
      - "scripts/comment-coverage-report.mjs"
      - "scripts/upsert-report-comment.mjs"
      - "scripts/tests/check-changed-coverage.test.mjs"
      - "scripts/tests/write-coverage-report.test.mjs"
      - "scripts/tests/comment-coverage-report.test.mjs"
      - ".code-multivitals.json"
      - "scripts/check-complexity.mjs"
      - "scripts/comment-complexity-report.mjs"
      - "scripts/tests/check-complexity.test.mjs"
      - "scripts/tests/comment-complexity-report.test.mjs"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter @stardust/core run check:code

  check-code-complexity:
    name: check-code-complexity
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The complexity gate diffs against the first parent.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        id: complexity
        run: |
          node --test scripts/tests/check-complexity.test.mjs scripts/tests/comment-complexity-report.test.mjs
          pnpm --filter @stardust/core run check:complexity --base HEAD^1 --output "$GITHUB_WORKSPACE/complexity-report.md"

      - name: Publish complexity on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.complexity.outputs.findings != '' }}
        uses: actions/github-script@v9
        env:
          HAS_FINDINGS: ${{ steps.complexity.outputs.findings }}
        with:
          script: |
            const { commentComplexityReport } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/comment-complexity-report.mjs`
            )
            const outcome = await commentComplexityReport({
              github,
              context,
              workspace: 'core',
              reportPath: `${process.env.GITHUB_WORKSPACE}/complexity-report.md`,
              hasFindings: process.env.HAS_FINDINGS === 'true',
            })
            core.info(`Complexity comment: ${outcome}`)

  check-types:
    name: Check types
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm --filter @stardust/core run check:types

  tests:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      coverage-comment: ${{ steps.coverage-comment.outputs.artifact-id }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The changed-lines coverage gate diffs against the first parent.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build LSP package
        run: pnpm --filter @stardust/lsp run build

      - name: Run tests
        run: pnpm --filter @stardust/core run test:coverage

      - name: Check coverage floors
        id: floors
        run: pnpm run check:coverage @stardust/core

      - name: Write coverage report
        if: ${{ !cancelled() && hashFiles('packages/core/coverage/coverage-summary.json') != '' }}
        run: node scripts/write-coverage-report.mjs core packages/core/coverage/coverage-summary.json packages/core/coverage/coverage-comment.md
        env:
          COVERAGE_OUTCOME: ${{ steps.floors.outcome }}

      - name: Check coverage of changed lines
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('packages/core/coverage/lcov.info') != '' }}
        run: |
          node --test scripts/tests/check-changed-coverage.test.mjs scripts/tests/write-coverage-report.test.mjs scripts/tests/comment-coverage-report.test.mjs
          node scripts/check-changed-coverage.mjs core packages/core/coverage/lcov.info --base HEAD^1 --output packages/core/coverage/coverage-comment.md

      - name: Upload coverage comment
        id: coverage-comment
        if: ${{ !cancelled() && github.event_name == 'pull_request' && hashFiles('packages/core/coverage/coverage-comment.md') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-coverage-comment
          path: packages/core/coverage/coverage-comment.md
          retention-days: 1

      - name: Upload coverage report
        if: ${{ !cancelled() && hashFiles('packages/core/coverage/lcov.info') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: core-coverage-report
          path: |
            packages/core/coverage/coverage-summary.json
            packages/core/coverage/lcov.info
          retention-days: 14

  coverage-comment:
    name: Publish coverage comment
    runs-on: ubuntu-latest
    needs: tests
    # Only this job can write on the pull request, and it installs no dependencies.
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && needs.tests.outputs.coverage-comment != '' }}
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: scripts

      - name: Download coverage comment
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: core-coverage-comment
          path: coverage-comment

      - name: Publish coverage on pull request
        uses: actions/github-script@v9
        with:
          script: |
            const { commentCoverageReport } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/comment-coverage-report.mjs`
            )
            const outcome = await commentCoverageReport({
              github,
              context,
              workspace: 'core',
              reportPath: `${process.env.GITHUB_WORKSPACE}/coverage-comment/coverage-comment.md`,
            })
            core.info(`Coverage comment: ${outcome}`)

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-code-complexity
      - check-types
      - tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run build:core
