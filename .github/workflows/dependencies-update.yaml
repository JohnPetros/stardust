name: Dependencies update

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron uses UTC. 12:00 UTC is 09:00 America/Sao_Paulo
    # while Sao Paulo remains at UTC-03:00.
    - cron: "0 12 * * 1"

permissions:
  contents: read

concurrency:
  group: dependencies-update
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  NPM_VERSION: "10.9.3"

jobs:
  update:
    name: Update patch and minor dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Create Stardust Hermes GitHub App token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.HERMES_GITHUB_APP_ID }}
          private-key: ${{ secrets.HERMES_GITHUB_APP_PRIVATE_KEY }}

      - name: Checkout weekly branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Prepare weekly branch
        id: branch
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          branch="chore/weekly-dependencies-update-$(date -u +%F)"
          echo "name=$branch" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git checkout -B "$branch" FETCH_HEAD
            git merge --no-edit origin/main
          else
            git checkout -b "$branch"
          fi

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm version
        run: npm install --global "npm@${NPM_VERSION}"

      - name: Verify runtime
        shell: bash
        run: |
          set -euo pipefail
          node --version
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Install baseline dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.98.2

      - name: Start Supabase test services
        working-directory: apps/server
        run: supabase start

      - name: Reset the test database
        working-directory: apps/server
        run: supabase db reset --local --yes

      - name: Create Server test environment
        working-directory: apps/server
        shell: bash
        run: |
          set -euo pipefail
          supabase status -o env > /tmp/supabase.env
          . /tmp/supabase.env

          cat <<'EOF' > .env.testing
          MODE='test'
          PORT='3333'
          BASE_URL='http://localhost'
          GOD_ACCOUNT_IDS=f4442be6-ad3e-415b-b31b-cc49a18e1119,
          SUPABASE_URL='http://127.0.0.1:54321'
          SUPABASE_ANON_KEY='__SUPABASE_SECRET_KEY__'
          SUPABASE_DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:54322/postgres
          REDIS_URL='redis://127.0.0.1:6379'
          S3_ACCOUNT_ID='test-account-id'
          S3_ACCESS_KEY_ID='test-access-key-id'
          S3_SECRET_ACCESS_KEY='test-secret-access-key'
          STARDUST_WEB_URL='http://localhost:3000'
          DROPBOX_REFRESH_TOKEN='test-refresh-token'
          DROPBOX_APP_KEY='test-app-key'
          DROPBOX_APP_SECRET='test-app-secret'
          DISCORD_WEBHOOK_URL='https://discord.com/api/webhooks/test'
          SENTRY_DSN='https://test@sentry.io/test'
          INNGEST_EVENT_KEY='test-event-key'
          INNGEST_SIGNING_KEY='test-signing-key'
          POSTHOG_PROJECT_TOKEN='test-posthog-project-token'
          POSTHOG_HOST='https://us.i.posthog.com'
          POSTHOG_PERSONAL_API_KEY='test-posthog-personal-api-key'
          POSTHOG_PROJECT_ID='1'
          EOF

          sed -i "s|__SUPABASE_SECRET_KEY__|${SECRET_KEY}|g" .env.testing
          cp .env.testing .env

      - name: Create Web App test environment
        shell: bash
        run: |
          cat <<'EOF' > apps/web/.env.testing
          MODE=testing
          NEXT_PUBLIC_STARDUST_WEB_URL=http://127.0.0.1:3100
          NEXT_PUBLIC_STARDUST_SERVER_URL=http://127.0.0.1:3100/api/tests/server
          NEXT_PUBLIC_SUPABASE_URL=https://testing.supabase.local
          NEXT_PUBLIC_SUPABASE_ANON_KEY=fake-supabase-anon-key
          NEXT_PUBLIC_CDN_URL=https://testing-cdn.local
          NEXT_PUBLIC_DISCORD_WEBHOOK_URL=https://discord.local/webhooks/testing
          NEXT_PUBLIC_SENTRY_DSN=https://public@example.ingest.sentry.io/123456
          NEXT_PUBLIC_DISCORD_CHANNEL_URL=https://discord.com/channels/987782561252143205/1377325380037509212
          GOOGLE_ANALYTICS_ID=fake-id
          NEXT_PUBLIC_POSTHOG_PROJECT_TOKEN=test-posthog-project-token
          NEXT_PUBLIC_POSTHOG_HOST=https://us.i.posthog.com
          EOF
          cp apps/web/.env.testing apps/web/.env

      - name: Install Playwright Chromium
        run: npm exec --workspace=@stardust/web -- playwright install --with-deps chromium

      - name: Apply and diagnose dependency updates
        env:
          DEPENDENCIES_UPDATE_BASE_REF: origin/main
          DEPENDENCIES_UPDATE_REPORT: ${{ runner.temp }}/dependencies-update-report.json
          DEPENDENCIES_UPDATE_MARKDOWN: ${{ runner.temp }}/dependencies-update-pr.md
        run: node ./scripts/dependencies-update.mjs

      - name: Detect update and PR reconciliation state
        id: changes
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail

          changed=false
          branch_has_updates=false
          open_pr=false

          if git diff --quiet -- package.json package-lock.json 'apps/*/package.json' 'packages/*/package.json'; then
            echo 'No eligible dependency updates are available.'
          else
            changed=true
          fi

          if ! git diff --quiet origin/main...HEAD; then
            branch_has_updates=true
          fi

          pr_number="$(
            gh pr list \
              --base main \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"
          if [ -n "$pr_number" ]; then
            open_pr=true
          fi

          reconcile_pr=false
          if [ "$changed" = true ] || [ "$branch_has_updates" = true ] || [ "$open_pr" = true ]; then
            reconcile_pr=true
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "branch_has_updates=$branch_has_updates" >> "$GITHUB_OUTPUT"
          echo "open_pr=$open_pr" >> "$GITHUB_OUTPUT"
          echo "reconcile_pr=$reconcile_pr" >> "$GITHUB_OUTPUT"

      - name: Validate final dependency state
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check:dependencies-update

      - name: Commit and push weekly update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        env:
          BRANCH: ${{ steps.branch.outputs.name }}
        run: |
          set -euo pipefail
          git config user.name 'stardust-hermes[bot]'
          git config user.email 'stardust-hermes[bot]@users.noreply.github.com'
          git add package.json package-lock.json 'apps/*/package.json' 'packages/*/package.json'
          git commit -m '📦 deps: update patch and minor dependencies'
          git push origin "HEAD:$BRANCH"

      - name: Create or update weekly pull request
        if: steps.changes.outputs.reconcile_pr == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: ${{ steps.branch.outputs.name }}
          BODY_PATH: ${{ runner.temp }}/dependencies-update-pr.md
        run: |
          set -euo pipefail
          pr_number="$(
            gh pr list \
              --base main \
              --head "$BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$pr_number" ]; then
            gh pr edit "$pr_number" \
              --title 'chore(deps): atualizar dependências semanais' \
              --body-file "$BODY_PATH"
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title 'chore(deps): atualizar dependências semanais' \
              --body-file "$BODY_PATH"
          fi

      - name: Upload dependency update report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dependencies-update-report
          path: |
            ${{ runner.temp }}/dependencies-update-report.json
            ${{ runner.temp }}/dependencies-update-pr.md
          if-no-files-found: ignore
          retention-days: 14
