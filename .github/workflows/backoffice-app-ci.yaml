name: Backoffice app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/backoffice/**"
      - "packages/core/**"
      - "packages/validation/**"
      - ".dependency-cruiser.cjs"
      - "coverage-baseline.json"
      - "scripts/check-coverage-baseline.mjs"
      - ".code-multivitals-baseline.json"
      - ".code-multivitals.json"
      - "scripts/check-complexity.mjs"
      - "scripts/tests/check-complexity.test.mjs"

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  architecture:
    name: Check architecture
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check architecture
        run: pnpm run check:architecture

  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check code
        run: pnpm --filter @stardust/backoffice run check:code

  check-code-complexity:
    name: check-code-complexity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        run: pnpm --filter @stardust/backoffice run check:complexity

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    needs:
      - check-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        env:
          VITE_SERVER_APP_URL: https://stardust-server.test
          VITE_CDN_URL: https://stardust-cdn.test
          VITE_WEB_APP_URL: https://stardust-web.test
        run: pnpm --filter @stardust/backoffice run check:types

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-types

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm --filter @stardust/backoffice run test:coverage

      - name: Check coverage baseline
        run: pnpm run check:coverage @stardust/backoffice

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-code-complexity
      - check-types
      - unit-tests
      - architecture

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build project
        env:
          VITE_SERVER_APP_URL: https://stardust-server.test
          VITE_CDN_URL: https://stardust-cdn.test
          VITE_WEB_APP_URL: https://stardust-web.test
        run: pnpm run build:backoffice
