name: Crew app CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/crew/**'
      - 'packages/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.dependency-cruiser.cjs'
      - 'Dockerfile.crew'
      - 'Dockerfile.crew.dockerignore'
      - '.dockerignore'
      - '.github/workflows/crew-app-ci.yaml'

permissions:
  contents: read

concurrency:
  group: crew-app-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    name: Crew lint, types, architecture, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @stardust/crew run check:code
      - run: pnpm --filter @stardust/crew run check:types
      - run: pnpm --filter @stardust/crew run check:architecture
      - run: pnpm --filter @stardust/crew run test:unit
      - run: pnpm --filter @stardust/crew run test:integration
      - run: pnpm run build:crew
      - run: docker build --file Dockerfile.crew --tag stardust-crew:ci .
