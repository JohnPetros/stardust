name: Dependabot lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'apps/*/package.json'
      - 'packages/*/package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'

permissions:
  contents: read

concurrency:
  group: dependabot-lockfile-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  regenerate:
    name: Regenerate lockfile
    # LOCKFILE_BOT_TOKEN is a Dependabot secret, so it is only available when Dependabot
    # itself triggers the run. Skip pushes made by anyone else to a Dependabot branch.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          # A token that is not GITHUB_TOKEN, so the push re-triggers the CI workflows.
          token: ${{ secrets.LOCKFILE_BOT_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Regenerate pnpm-lock.yaml
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "📦 deps: regenerate lockfile"
          git push
