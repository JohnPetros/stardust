name: Studio app CD

on:
  push:
    branches:
      - main
    paths:
      - "apps/studio/**"
      - "packages/core/**"
      - "packages/validation/**"
      - "packages/lsp/**"

permissions:
  contents: read

concurrency:
  group: studio-app-cd-coolify-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Coolify deploy
        env:
          COOLIFY_WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_STUDIO }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          curl -X GET "$COOLIFY_WEBHOOK_URL" \
            -H "Authorization: Bearer $COOLIFY_API_TOKEN" \
            --fail --silent --show-error \
            --connect-timeout 15 \
            --max-time 60 \
            --retry 5 \
            --retry-delay 10 \
            --retry-max-time 180 \
            --retry-connrefused
