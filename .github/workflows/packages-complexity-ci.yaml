name: Packages complexity CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/packages-complexity-ci.yaml"
      - ".code-multivitals.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/email/**"
      - "packages/lsp/**"
      - "packages/validation/**"
      - "scripts/check-complexity.mjs"
      - "scripts/comment-complexity-report.mjs"
      - "scripts/tests/check-complexity.test.mjs"
      - "scripts/tests/comment-complexity-report.test.mjs"

permissions:
  contents: read

concurrency:
  group: packages-complexity-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"

jobs:
  check-code-complexity:
    name: check-code-complexity (${{ matrix.package }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        package: [email, lsp, validation]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          # The complexity gate diffs against the first parent.
          fetch-depth: 2

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check complexity
        id: complexity
        run: |
          node --test scripts/tests/check-complexity.test.mjs scripts/tests/comment-complexity-report.test.mjs
          pnpm --filter @stardust/${{ matrix.package }} run check:complexity --base HEAD^1 --output "$GITHUB_WORKSPACE/complexity-report.md"

      - name: Publish complexity on pull request
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.complexity.outputs.findings != '' }}
        uses: actions/github-script@v9
        env:
          HAS_FINDINGS: ${{ steps.complexity.outputs.findings }}
          PACKAGE: ${{ matrix.package }}
        with:
          script: |
            const { commentComplexityReport } = await import(
              `${process.env.GITHUB_WORKSPACE}/scripts/comment-complexity-report.mjs`
            )
            const outcome = await commentComplexityReport({
              github,
              context,
              workspace: process.env.PACKAGE,
              reportPath: `${process.env.GITHUB_WORKSPACE}/complexity-report.md`,
              hasFindings: process.env.HAS_FINDINGS === 'true',
            })
            core.info(`Complexity comment: ${outcome}`)
