name: Studio app CI

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "apps/studio/**"
      - "packages/core/**"
      - "packages/validation/**"
      - ".dependency-cruiser.cjs"
      - "knip.json"

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  check-code:
    name: Check code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: npm run check:code -w @stardust/studio

  check-types:
    name: Check types
    runs-on: ubuntu-latest
    needs:
      - check-code

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check types
        run: npm run check:types -w @stardust/studio

  tests:
    name: Tests
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-types

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit -w @stardust/studio

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - check-code
      - check-types
      - tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        env:
          VITE_SERVER_APP_URL: https://stardust-server.test
          VITE_CDN_URL: https://stardust-cdn.test
          VITE_WEB_APP_URL: https://stardust-web.test
        run: npm run build:studio
