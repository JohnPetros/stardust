services:
  supabase-postgres:
    image: supabase/postgres:17.6.1.143

  supabase-role-init:
    image: supabase/postgres:17.6.1.143

  supabase-auth:
    image: supabase/gotrue:v2.193.0
    environment:
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100000/1h"

  supabase-rest:
    image: postgrest/postgrest:v14.15

  supabase-realtime:
    image: supabase/realtime:v2.113.4

  supabase-mailpit:
    image: axllent/mailpit:v1.30.2

  minio:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    command: []
    environment:
      RUSTFS_ACCESS_KEY: ${MINIO_ROOT_USER:?Set local-only MINIO_ROOT_USER}
      RUSTFS_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set local-only MINIO_ROOT_PASSWORD}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_VOLUMES: /data
    volumes:
      - rustfs-ci-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s

  minio-init:
    image: amazon/aws-cli:2.27.41
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set local-only MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set local-only MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      MINIO_BUCKET: ${MINIO_BUCKET:-stardust-bucket-local}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        aws --endpoint-url http://minio:9000 s3api head-bucket --bucket "$${MINIO_BUCKET}" >/dev/null 2>&1
        || aws --endpoint-url http://minio:9000 s3api create-bucket --bucket "$${MINIO_BUCKET}"

  supabase-db-reset:
    image: supabase/postgres:17.6.1.143

volumes:
  rustfs-ci-data:
