resources:
  - name: supabase-local-listener
    "@type": type.googleapis.com/envoy.config.listener.v3.Listener
    address:
      socket_address:
        address: 0.0.0.0
        port_value: 8000
    filter_chains:
      - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: supabase_local
              codec_type: AUTO
              use_remote_address: true
              upgrade_configs:
                - upgrade_type: websocket
              route_config:
                name: supabase_local_routes
                virtual_hosts:
                  - name: supabase_local
                    domains: ["*"]
                    cors:
                      allow_origin_string_match:
                        - safe_regex:
                            google_re2: {}
                            regex: "^http://(localhost|127\\.0\\.0\\.1)(:[0-9]+)?$"
                      allow_methods: "GET, POST, PUT, PATCH, DELETE, OPTIONS"
                      allow_headers: "accept, authorization, content-type, apikey, x-api-key, x-client-info, x-supabase-api-version, prefer, range, x-client-data"
                      expose_headers: "content-range, x-total-count"
                      max_age: "3600"
                    routes:
                      - match:
                          prefix: /auth/v1/
                        route:
                          cluster: supabase-auth
                          prefix_rewrite: /
                      - match:
                          prefix: /rest/v1/
                        route:
                          cluster: supabase-rest
                          prefix_rewrite: /
                      - match:
                          prefix: /realtime/v1/api
                        route:
                          cluster: supabase-realtime
                          prefix_rewrite: /api
                          timeout: 0s
                      - match:
                          prefix: /realtime/v1/
                        route:
                          cluster: supabase-realtime
                          prefix_rewrite: /socket/
                          timeout: 0s
              http_filters:
                - name: envoy.filters.http.cors
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.cors.v3.Cors
                - name: envoy.filters.http.lua
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                    inline_code: |
                      local publishable_key = "__SUPABASE_PUBLISHABLE_KEY__"
                      local internal_anon_key = "__SUPABASE_ANON_KEY__"

                      local function query_value(path, name)
                        local query = string.match(path, "%?(.*)")
                        if query == nil then
                          return nil
                        end
                        for pair in string.gmatch(query, "[^&]+") do
                          local key, value = string.match(pair, "^([^=]+)=?(.*)$")
                          if key == name then
                            return value
                          end
                        end
                        return nil
                      end

                      function envoy_on_request(handle)
                        local headers = handle:headers()
                        local path = headers:get(":path") or "/"
                        local is_realtime_socket = string.find(path, "^/realtime/v1/") ~= nil
                          and string.find(path, "^/realtime/v1/api") == nil
                        local is_auth_callback = path == "/auth/v1/callback"
                          or string.find(path, "^/auth/v1/callback[?&]") ~= nil

                        local api_key = headers:get("apikey")
                        if api_key == nil then
                          api_key = query_value(path, "apikey")
                        end

                        if api_key ~= publishable_key then
                          if not (is_auth_callback and api_key == nil) then
                            handle:respond({[":status"] = "401"}, "Unauthorized")
                            return
                          end
                        else
                          headers:replace("apikey", internal_anon_key)
                          path = string.gsub(path, "([?&]apikey=)[^&]*", "%1" .. internal_anon_key)
                          headers:replace(":path", path)
                        end

                        if is_auth_callback then
                          headers:remove("authorization")
                          return
                        end

                        if is_realtime_socket then
                          headers:replace("x-api-key", internal_anon_key)
                          return
                        end

                        local authorization = headers:get("authorization")
                        local bearer = authorization and string.match(authorization, "^[Bb]earer%s+(.+)$") or nil
                        bearer = authorization and string.match(authorization, "^[Bb]earer%s+(.+)$") or nil
                        local is_jwt = bearer ~= nil
                          and string.match(bearer, "^[A-Za-z0-9_-]+%.[A-Za-z0-9_-]+%.[A-Za-z0-9_-]+$") ~= nil
                        if not is_jwt then
                          headers:replace("authorization", "Bearer " .. internal_anon_key)
                        end
                      end
                - name: envoy.filters.http.router
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
